name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_legacy_scope:
        description: "Also publish @droposs/* legacy-scope mirror packages"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment" configured on the npm Trusted Publisher,
    # otherwise npm rejects the OIDC exchange with a 404.
    environment: Heretek-Games
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          # NOTE: no `registry-url` — setup-node would write a dummy
          # //registry.npmjs.org/:_authToken into .npmrc, which disables OIDC
          # trusted publishing.

      - name: Upgrade npm for Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@11.5.1 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r run build

      - name: Run test suites
        run: pnpm -r run test

      - name: Publish @drop-oss/plugin-sdk
        working-directory: packages/plugin-sdk
        run: npm publish --access public --provenance --no-git-checks

      - name: Publish @drop-oss/plugin-cli
        working-directory: packages/plugin-cli
        run: npm publish --access public --provenance --no-git-checks

      - name: Publish @droposs legacy-scope mirrors
        if: ${{ github.event_name == 'push' || inputs.publish_legacy_scope }}
        run: node scripts/publish-legacy-scope.mjs
