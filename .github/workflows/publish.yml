name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment" configured on the npm Trusted Publisher,
    # otherwise npm rejects the OIDC exchange with a 404.
    environment: Heretek-Games
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
          # NOTE: no `registry-url` — setup-node would write a dummy
          # //registry.npmjs.org/:_authToken into .npmrc, which disables OIDC
          # trusted publishing.

      - name: Upgrade npm for Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@11.5.1 --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r run build

      - name: Run test suites
        run: pnpm -r run test

      - name: Publish @drop-oss/plugin-sdk
        run: pnpm --filter @drop-oss/plugin-sdk publish --access public --provenance --no-git-checks

      - name: Publish @drop-oss/plugin-cli
        run: pnpm --filter @drop-oss/plugin-cli publish --access public --provenance --no-git-checks
