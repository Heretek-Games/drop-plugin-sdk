name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_legacy_scope:
        description: "Publish @droposs/* packages (the accessible scope)"
        type: boolean
        default: true
      publish_new_scope:
        description: "Publish @drop-oss/* packages (only once the scope/Trusted Publisher access exists on npmjs.com)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishing via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the "Environment" configured on the npm Trusted Publisher,
    # otherwise npm rejects the OIDC exchange with a 404.
    environment: Heretek-Games
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          # NOTE: no `registry-url` — setup-node would write a dummy
          # //registry.npmjs.org/:_authToken into .npmrc, which disables OIDC
          # trusted publishing.

      - name: Setup npm for Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo packages
        run: pnpm -r run build

      - name: Run test suites
        run: pnpm -r run test

      - name: Publish @droposs plugin-sdk
        if: ${{ github.event_name == 'push' || inputs.publish_legacy_scope }}
        working-directory: packages/plugin-sdk
        run: node ../../scripts/publish-legacy-scope.mjs --package plugin-sdk

      - name: Publish @droposs plugin-cli
        if: ${{ github.event_name == 'push' || inputs.publish_legacy_scope }}
        working-directory: packages/plugin-cli
        run: node ../../scripts/publish-legacy-scope.mjs --package plugin-cli

      - name: Publish @drop-oss plugin-sdk (new scope, when accessible)
        if: ${{ inputs.publish_new_scope }}
        working-directory: packages/plugin-sdk
        run: node ../../scripts/publish-legacy-scope.mjs --package plugin-sdk --scope @drop-oss

      - name: Publish @drop-oss plugin-cli (new scope, when accessible)
        if: ${{ inputs.publish_new_scope }}
        working-directory: packages/plugin-cli
        run: node ../../scripts/publish-legacy-scope.mjs --package plugin-cli --scope @drop-oss
