name: Release Drop Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build, Sign, and Release Package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install

      - name: Run Unit Tests
        run: npx @droposs/plugin-cli test .

      - name: Build Bundles
        run: npx @droposs/plugin-cli build .

      - name: Validate Manifest
        run: npx @droposs/plugin-cli validate .

      - name: Package Plugin Archive
        run: npx @droposs/plugin-cli pack . ./dist-package

      - name: Generate Checksums
        id: pkg
        run: |
          FILE=$(ls dist-package/*.dropplugin | head -n 1)
          echo "path=$FILE" >> $GITHUB_OUTPUT
          echo "filename=$(basename $FILE)" >> $GITHUB_OUTPUT
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
